[package]
name = "libos-terminal"
edition = "2024"

[lib]
name = "os_terminal"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1

[dependencies.os-terminal]
version = "0.7.4"
default-features = false

[features]
default = ["swash", "woff2"]
ab_glyph = ["os-terminal/ab_glyph"]
swash = ["os-terminal/swash"]
woff2 = ["os-terminal/woff2"]
